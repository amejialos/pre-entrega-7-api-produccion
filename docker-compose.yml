# Infraestructura local de la API: Redis (estado de jobs + checkpoints de LangGraph) y
# Arize Phoenix (trazas OpenInference, costo y latencia).
#
#   docker compose up -d                  # Redis + Phoenix; la API corre con uv (ver README)
#   docker compose --profile app up -d    # además, la API dentro de un contenedor
#
# Los datos de los dos servicios quedan en volúmenes con nombre: sobreviven a
# `docker compose down` (solo se borran con `down -v`).
name: pe7-api-agente

services:
  redis:
    # redis:8 trae los módulos JSON y Search que necesita langgraph-checkpoint-redis.
    image: redis:8
    ports:
      - "6379:6379"
    # AOF: cada escritura se persiste en disco; los checkpoints sobreviven a un reinicio.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-20.21.1
    ports:
      - "6006:6006"   # UI + colector OTLP por HTTP (/v1/traces)
      - "4317:4317"   # colector OTLP por gRPC
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data

  api:
    profiles: ["app"]
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started

volumes:
  redis-data:
  phoenix-data:
