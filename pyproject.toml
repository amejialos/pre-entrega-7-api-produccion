[project]
name = "api-orquestador-multiagente"
version = "0.1.0"
description = "Pre-entrega 7: API REST asíncrona (FastAPI) del orquestador multi-agente, con Redis, Phoenix y human-in-the-loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-redis>=0.5.2",
    "openinference-instrumentation-langchain>=0.1.79",
    "pinecone>=7.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

# No es un paquete instalable: el código vive en `app/` y se importa desde la raíz.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # langchain-community avisa que está en retirada; BM25Retriever todavía vive ahí.
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
    # Aviso interno de langgraph-checkpoint-redis (no es de nuestro código).
    "ignore:get_async_redis_connection will become a coroutine:DeprecationWarning",
]
log_level = "WARNING"

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
